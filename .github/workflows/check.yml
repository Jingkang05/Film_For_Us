name: Phase 4 checks
on:
  push:
    branches: [main, codex/phase-4-supabase-multi-user]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: node scripts/check-phase4-browser.mjs
      - run: node scripts/build-ui-preview.mjs
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: codex/phase-4-supabase-multi-user
      - run: node scripts/check-ui-preview.mjs
